name: live-sources

# Checks the LIVE addresses the demo reads from (chinookdb.com and the jsDelivr mirror), once a
# day: the SHA-256 of the Invoice file and of the SQLite file at both addresses equals what this
# repository pins, the Invoice rows sum to the golden result's totals, and the saved query over the
# live SQLite file still gives the golden result. A red run is the alarm that chinookdb.com changed
# (or went away).
#
# It is a separate workflow on purpose and is NOT a required check: pull requests are never
# blocked by a third-party site. It runs on pull requests only when this file or the checker
# changes, so those changes are proven; it opens an issue only on the schedule.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/live-sources.yml
      - scripts/check-web-files.mjs

permissions:
  contents: read

jobs:
  live-sources:
    name: live-sources
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # to open or update the alarm issue on a failed scheduled run
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # actions/checkout v6

      - name: Install the schema validator (lock file pins it)
        run: npm ci --prefix scripts --ignore-scripts

      - name: Live addresses have the pinned checksums and the golden totals
        run: node scripts/check-web-files.mjs --fetch=live

      - name: Fetch Chinook (verified)
        run: scripts/fetch-chinook.sh

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: tests/go.mod

      - name: Saved query over the live file equals the golden result
        env:
          DATATUG_REQUIRE_CHINOOK: "1"
        run: go -C tests test . -run 'TestPinnedChinookDatabase|TestHeroQuery_PinnedChinook|TestGoldenResultFile' -v -count=1

      - name: Open or update the alarm issue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="live-sources: chinookdb.com data changed or is not reachable"
          existing="$(gh issue list --state open --limit 100 --json number,title --jq "map(select(.title == \"${title}\"))[0].number // empty")"
          body="The daily live-sources check failed: ${RUN_URL}. The addresses are in web/catalogs/chinook/chinook.db.json and fixtures/chinook/chinookdb.json; the expected result is golden/sales-per-capita.json."
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body "${body}"
          else
            gh issue create --title "${title}" --body "${body}"
          fi
