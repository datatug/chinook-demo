name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:

  # Vet, lint and test the demo project's Go tests (module in tests/) with the
  # fleet's shared workflow. This is a demo-project repository, not a versioned
  # library, so releases are not tagged from here.
  test:
    permissions:
      contents: write # declared by the reusable workflow's (disabled) tagging job
    uses: strongo/cicd/.github/workflows/workflow.yml@v1.21.0
    with:
      working_directory: tests
      disable-version-bumping: true
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The hero query over the REAL Chinook file from chinookdb.com. The ordinary test run
  # above cannot see that file, so the pinned-Chinook tests skip there; this job downloads
  # it (scripts/fetch-chinook.sh: chinookdb.com, the pinned jsDelivr mirror when it does not
  # answer), verifies its SHA-256 against fixtures/chinook/chinookdb.json, and runs:
  #   1. the Go tests with DATATUG_REQUIRE_CHINOOK, so a missing file fails instead of
  #      skipping: the saved query's rows equal golden/sales-per-capita.json;
  #   2. scripts/run-hero-demo.sh with the RELEASED DataTug CLI (the release below, its
  #      SHA-256 checked): the same rows again, through the program a visitor installs.
  # Required for merging.
  hero:
    name: hero
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # actions/checkout v6

      - name: Fetch Chinook from chinookdb.com and verify its SHA-256
        run: scripts/fetch-chinook.sh

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: tests/go.mod

      - name: Saved query through the Go engine equals the golden result
        env:
          DATATUG_REQUIRE_CHINOOK: "1"
        run: go -C tests test . -run 'TestPinnedChinookDatabase|TestHeroQuery_PinnedChinook|TestGoldenResultFile' -v -count=1

      # The organization only allows a fixed list of third-party actions, so the released CLI
      # is installed from its GitHub release with the archive's SHA-256 checked.
      - name: Install the released DataTug CLI
        env:
          DATATUG_VERSION: 0.52.0
          DATATUG_SHA256: 164839fdab8439ac446fe11bcb20d6583bbe23d395ea0d99fdd28c2d37c6e389
        run: |
          set -euo pipefail
          archive="datatug_${DATATUG_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/datatug/datatug-cli/releases/download/v${DATATUG_VERSION}/${archive}" \
            --output "${RUNNER_TEMP}/${archive}"
          echo "${DATATUG_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/datatug-cli"
          tar --extract --gzip --file "${RUNNER_TEMP}/${archive}" --directory "${RUNNER_TEMP}/datatug-cli" datatug
          echo "${RUNNER_TEMP}/datatug-cli" >> "$GITHUB_PATH"

      - name: Hero script through the released CLI equals the golden result
        run: scripts/run-hero-demo.sh

  # The files a browser reads: the `web` environment and the prepared questions are valid
  # against the JSON Schemas (fetched from datatug/datatug-apps at a pinned commit), the
  # catalog's checksum equals the Invoice file on the pinned mirror and its numbers equal
  # the golden result, the one-file geo tables (data/geo/.web) equal the records they are
  # generated from, and every file a cold demo run reads exists. The daily check of the
  # LIVE addresses is a separate workflow (live-sources.yml): it must not make this one
  # flaky. Required for merging.
  web-files:
    name: web-files
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # actions/checkout v6

      - name: Install the schema validator (lock file pins it)
        run: npm ci --prefix scripts --ignore-scripts

      - name: Validate the web files and check their checksums
        run: node scripts/check-web-files.mjs --fetch=mirror

      - name: One-file geo tables equal the records
        run: python3 scripts/build-web-geo.py --check

  # The vendored geo data must be exactly geo-ingitdb at the commit recorded in
  # data/geo/.vendored-from, and must itself be a valid inGitDB database. Scripts
  # are shellchecked and the Python helper must at least compile.
  vendored_data_and_scripts:
    name: Vendored geo data and scripts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # actions/checkout v6

      - name: Read the vendored geo-ingitdb commit
        id: vendored
        run: |
          set -euo pipefail
          echo "commit=$(sed -n 's/^commit=//p' data/geo/.vendored-from)" >> "$GITHUB_OUTPUT"

      - name: Checkout geo-ingitdb at that commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # actions/checkout v6
        with:
          repository: ingitdb/geo-ingitdb
          ref: ${{ steps.vendored.outputs.commit }}
          path: geo-ingitdb
          persist-credentials: false

      - name: Vendored copy matches geo-ingitdb
        run: scripts/sync-geo-data.sh --check geo-ingitdb

      # The datatug organization only allows a fixed list of third-party actions,
      # which excludes ingitdb/ingitdb-action, so the pinned ingitdb-cli release is
      # installed here with its SHA-256 checked (the same release and checks that
      # action performs).
      - name: Install pinned ingitdb CLI
        env:
          INGITDB_VERSION: 0.68.2
          INGITDB_SHA256: d00ba83a02b64025884a495b94245640c760dc94d1726f4db6f33d32ec9d4dce
        run: |
          set -euo pipefail
          archive="ingitdb_${INGITDB_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/ingitdb/ingitdb-cli/releases/download/v${INGITDB_VERSION}/${archive}" \
            --output "${RUNNER_TEMP}/${archive}"
          echo "${INGITDB_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "${RUNNER_TEMP}/${archive}" --directory "${RUNNER_TEMP}" ingitdb
          install -m 0755 "${RUNNER_TEMP}/ingitdb" "${RUNNER_TEMP}/bin-ingitdb"
          mkdir -p "${RUNNER_TEMP}/bin" && mv "${RUNNER_TEMP}/bin-ingitdb" "${RUNNER_TEMP}/bin/ingitdb"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"

      - name: Validate the vendored inGitDB database
        run: ingitdb validate --path data/geo

      - name: Shellcheck the scripts
        run: shellcheck scripts/*.sh

      # data/geo/country_aliases is not vendored: it is generated, with
      # mappings/chinook.country-values.json, from the distinct country values of the pinned
      # Chinook file and the country concept of github.com/meaninggraph/core at the commit the
      # mapping pins. The generator reads the Chinook file with node:sqlite (Node 22.13 or newer).
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install the YAML parser (lock file pins it)
        run: npm ci --prefix scripts --ignore-scripts

      - name: Country mapping generator tests
        run: node --test scripts/test-country-mapping.mjs

      - name: Country mapping and aliases equal what Chinook and meaninggraph/core give
        run: node scripts/build-country-mapping.mjs --check

      - name: Compile the Python helpers
        run: python3 -m py_compile scripts/prepare_chinook.py scripts/compare-golden.py scripts/build-web-geo.py
        env:
          PYTHONDONTWRITEBYTECODE: "1"
